version: '3.8'

services:
  # ============================================================================
  # PostgreSQL 16 (With WAL Archiving & Connection Pooling)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: colony_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-colony_prod_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_production_password_securely}
      POSTGRES_DB: ${POSTGRES_DB:-colony_deposit_production}
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f"
      - "-c"
      - "max_wal_senders=3"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "max_connections=150"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ./scripts/init-prod-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-colony_prod_admin} -d ${POSTGRES_DB:-colony_deposit_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ============================================================================
  # Redis 7 (AOF Persistence & LRU Eviction for BullMQ + Cache)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: colony_redis_prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-secure_redis_auth_token_99}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_auth_token_99}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ============================================================================
  # NestJS Payments, Webhook & BullMQ Background Worker Service
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: colony_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-colony_prod_admin}:${POSTGRES_PASSWORD:-change_this_production_password_securely}@postgres:5432/${POSTGRES_DB:-colony_deposit_production}?schema=public&connection_limit=25"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-secure_redis_auth_token_99}@redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://deposit.yourcolony.org}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ============================================================================
  # Next.js 15 PWA Frontend Web Application
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: colony_web_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-colony_prod_admin}:${POSTGRES_PASSWORD:-change_this_production_password_securely}@postgres:5432/${POSTGRES_DB:-colony_deposit_production}?schema=public&connection_limit=25"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-secure_redis_auth_token_99}@redis:6379"
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://deposit.yourcolony.org}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

volumes:
  postgres_prod_data:
  postgres_wal_archive:
  redis_prod_data:

