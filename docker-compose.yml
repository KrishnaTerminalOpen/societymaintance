version: '3.8'

services:
  # ==============================================================================
  # Primary PostgreSQL Database with Healthcheck
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: colonydeposit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: colonydeposit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d colonydeposit']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - colony-network

  # ==============================================================================
  # Redis Cache & BullMQ Queue Broker
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: colonydeposit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - colony-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  colony-network:
    driver: bridge

